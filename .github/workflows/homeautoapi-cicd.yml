name: Deploy Docker Image to Target Environment
on:
  push:
    branches:
      - main

jobs:
  build-image: 
    runs-on: [self-hosted, Linux, X64]
    steps: 
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Build Image
      run: docker build -t homeautoapi:latest .

    - name: Stop and Remove Existing Container
      run: |
        docker stop homeautoapi || true
        docker rm homeautoapi || true

    - name: Run New Container
      run: |
        docker run -d --name homeautoapi --restart unless-stopped --env-file /opt/homeautoapi/.env -p 8080:8080 homeautoapi:latest
